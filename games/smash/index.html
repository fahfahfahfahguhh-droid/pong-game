<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smash Arena - You vs AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
            overflow: hidden;
        }
        #backLink {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
            z-index: 100;
            transition: color 0.2s;
        }
        #backLink:hover { color: #fff; }
        
        .screen {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Character Select */
        #charSelect {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
            padding: 30px;
            overflow-y: auto;
        }
        #charSelect.hidden {
            display: none;
        }
        #charSelect h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #charSelect .subtitle {
            color: #666;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .char-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 900px;
            min-height: 300px;
        }
        .char-card {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .char-card:hover {
            transform: translateY(-5px);
            border-color: #feca57;
            box-shadow: 0 10px 30px rgba(254,202,87,0.2);
        }
        .char-card.selected {
            border-color: #48dbfb;
            box-shadow: 0 0 30px rgba(72,219,251,0.4);
        }
        .char-icon {
            font-size: 40px;
            margin-bottom: 5px;
        }
        .char-name {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .char-type {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 5px;
        }
        .char-stats {
            display: flex;
            justify-content: center;
            gap: 10px;
            font-size: 0.7rem;
        }
        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stat-bar {
            width: 30px;
            height: 5px;
            background: #333;
            border-radius: 2px;
            margin-top: 2px;
            overflow: hidden;
        }
        .stat-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s;
        }
        .special-move {
            margin-top: 6px;
            padding: 5px;
            background: rgba(255,107,107,0.2);
            border-radius: 4px;
            font-size: 0.65rem;
            color: #ff6b6b;
        }
        .select-btn {
            margin-top: 40px;
            padding: 15px 60px;
            font-size: 1.2rem;
            background: linear-gradient(90deg, #48dbfb, #5f27cd);
            border: none;
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .select-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(72,219,251,0.4);
        }
        .select-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Map Select */
        #mapSelect {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
            padding: 40px;
        }
        #mapSelect.hidden {
            display: none;
        }
        #mapSelect h1 {
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: #fff;
        }
        .map-grid {
            display: flex;
            gap: 30px;
            min-height: 300px;
        }
        .map-card {
            width: 280px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .map-card:hover {
            transform: translateY(-5px);
            border-color: #1dd1a1;
        }
        .map-card.selected {
            border-color: #1dd1a1;
            box-shadow: 0 0 30px rgba(29,209,161,0.4);
        }
        .map-preview {
            height: 160px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }
        .map-name {
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
        }
        .map-desc {
            font-size: 0.8rem;
            color: #888;
            text-align: center;
            margin-top: 5px;
        }

        /* Game Screen */
        #gameScreen {
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0a0a0f;
        }
        #gameScreen.hidden {
            display: none;
        }
        #gameCanvas {
            display: block;
            background: #1a1a2e;
            border: 3px solid #636e72;
            border-radius: 6px;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }
        .player-hud {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .player-name {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .player-name.p1 { color: #48dbfb; }
        .player-name.p2 { color: #ff6b6b; }
        .health-bar {
            width: 250px;
            height: 20px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .health-fill {
            height: 100%;
            transition: width 0.2s;
            border-radius: 8px;
        }
        .health-fill.p1 { background: linear-gradient(90deg, #48dbfb, #5f27cd); }
        .health-fill.p2 { background: linear-gradient(90deg, #ff6b6b, #ee5a24); }
        .percent {
            font-size: 1.5rem;
            font-weight: bold;
            color: #feca57;
        }
        .stock-display {
            display: flex;
            gap: 5px;
        }
        .stock {
            width: 30px;
            height: 30px;
            background: #48dbfb;
            border-radius: 50%;
            border: 2px solid #fff;
        }
        .stock.lost { opacity: 0.3; }
        #centerHUD {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
        #gameMessage {
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            display: none;
        }
        #gameMessage.show { display: block; }
        #gameControls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #666;
            font-size: 0.8rem;
            text-align: center;
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.2s; }
    </style>
</head>
<body>
    <a href="../../index.html" id="backLink">← Back to Games</a>

    <!-- Character Select -->
    <div id="charSelect" class="screen active">
        <h1>Choose Your Fighter</h1>
        <p class="subtitle">Select your character to battle • 6 Fighters</p>
        <div class="char-grid" id="charGrid"></div>
        <button class="select-btn" id="confirmChar" disabled>Continue →</button>
    </div>

    <!-- Map Select -->
    <div id="mapSelect" class="screen hidden">
        <h1>Select Arena</h1>
        <div class="map-grid" id="mapGrid"></div>
        <button class="select-btn" id="startGame" disabled>Start Battle!</button>
    </div>

    <!-- Game -->
    <div id="gameScreen" class="hidden">
        <canvas id="gameCanvas"></canvas>
        <div id="hud">
            <div class="player-hud">
                <div class="player-name p1" id="p1Name">Player</div>
                <div class="health-bar"><div class="health-fill p1" id="p1Health" style="width: 100%"></div></div>
                <div class="percent" id="p1Percent">0%</div>
                <div class="stock-display" id="p1Stock"></div>
            </div>
            <div class="player-hud" style="align-items: flex-end;">
                <div class="player-name p2" id="p2Name">CPU</div>
                <div class="health-bar"><div class="health-fill p2" id="p2Health" style="width: 100%"></div></div>
                <div class="percent" id="p2Percent">0%</div>
                <div class="stock-display" id="p2Stock"></div>
            </div>
        </div>
        <div id="centerHUD">
            <div id="gameMessage"></div>
        </div>
        <div id="gameControls">
            WASD/Arrows: Move | J: Attack | K: Special | L/Space: Jump | R: Restart
        </div>
    </div>

    <script>
        // Character Definitions
        const CHARACTERS = [
            {
                id: 'mario', name: 'Mario', type: 'Balanced', icon: '🍄',
                color: '#e74c3c',
                stats: { speed: 5, power: 6, jump: 5 },
                special: 'Fireball - Shoots bouncing fireballs',
                specialCooldown: 80,
                description: 'The iconic hero - well-rounded and reliable'
            },
            {
                id: 'bowser', name: 'Bowser', type: 'Power', icon: '👑',
                color: '#8e44ad',
                stats: { speed: 3, power: 9, jump: 3 },
                special: 'Fire Breath - Stream of growing flames',
                specialCooldown: 150,
                description: 'The Koopa King - massive power, slow but deadly'
            },
            {
                id: 'link', name: 'Link', type: 'Balanced', icon: '🗡️',
                color: '#27ae60',
                stats: { speed: 5, power: 7, jump: 5 },
                special: 'Spin Attack - Spinning blade slash that pushes forward',
                specialCooldown: 90,
                description: 'Hero of Hyrule - sword master with spin attack'
            },
            {
                id: 'samus', name: 'Samus', type: 'Tactical', icon: '🤖',
                color: '#d35400',
                stats: { speed: 5, power: 6, jump: 5 },
                special: 'Charge Shot - Fast, powerful energy beam',
                specialCooldown: 100,
                description: 'Bounty hunter - long-range specialist'
            },
            {
                id: 'kirby', name: 'Kirby', type: 'Balanced', icon: '💨',
                color: '#ffb6c1',
                stats: { speed: 6, power: 4, jump: 6 },
                special: 'Inhale - Sucks in nearby opponents and spits them away',
                specialCooldown: 80,
                description: 'Pink puffball - can float with up to 4 jumps'
            },
            {
                id: 'pikachu', name: 'Pikachu', type: 'Agile', icon: '⚡',
                color: '#f1c40f',
                stats: { speed: 9, power: 4, jump: 7 },
                special: 'Thunder - Strikes opponents from above with lightning',
                specialCooldown: 110,
                description: 'Electric mouse - incredibly fast and agile'
            }
        ];

        const MAPS = [
            {
                id: 'training', name: 'Training Grounds', icon: '🏟️',
                desc: 'Classic flat platform layout',
                bgColor: '#2d3436',
                platforms: [
                    { x: 300, y: 520, w: 600, h: 25 },
                    { x: 100, y: 640, w: 250, h: 25 },
                    { x: 850, y: 640, w: 250, h: 25 }
                ]
            },
            {
                id: 'sky', name: 'Sky Tower', icon: '☁️',
                desc: 'Vertical multi-tiered arena',
                bgColor: '#0a3d62',
                platforms: [
                    { x: 400, y: 280, w: 400, h: 25 },
                    { x: 200, y: 460, w: 300, h: 25 },
                    { x: 700, y: 460, w: 300, h: 25 },
                    { x: 450, y: 620, w: 300, h: 25 }
                ]
            },
            {
                id: 'volcano', name: 'Volcano Edge', icon: '🌋',
                desc: 'Hazardous lava platforms',
                bgColor: '#2c0a0a',
                platforms: [
                    { x: 475, y: 280, w: 250, h: 25 },
                    { x: 150, y: 380, w: 250, h: 25 },
                    { x: 800, y: 380, w: 250, h: 25 },
                    { x: 300, y: 520, w: 250, h: 25 },
                    { x: 650, y: 520, w: 250, h: 25 }
                ]
            }
        ];

        // Game State
        let selectedChar = null;
        let selectedMap = null;
        let canvas, ctx;
        let players = [];
        let projectiles = [];
        let shockwaves = [];
        let particles = [];
        let specialEffects = [];
        let screenFlash = { color: '', frames: 0 };
        let gameTimeouts = [];
        let currentMap = null;
        let gameRunning = false;

        let bgClouds = [
            { x: 100, y: 100, speed: 0.2, size: 60 },
            { x: 400, y: 180, speed: 0.15, size: 80 },
            { x: 800, y: 80, speed: 0.25, size: 50 },
            { x: 250, y: 400, speed: 0.1, size: 70 },
            { x: 700, y: 300, speed: 0.18, size: 90 }
        ];

        let bgLavaBubbles = [];
        for (let i = 0; i < 15; i++) {
            bgLavaBubbles.push({
                x: Math.random() * 1200,
                y: 700 + Math.random() * 50,
                vy: -0.5 - Math.random() * 1,
                size: 4 + Math.random() * 8,
                alpha: 0.5 + Math.random() * 0.5
            });
        }

        // Initialize
        function init() {
            createCharGrid();
            createMapGrid();
            
            document.getElementById('confirmChar').addEventListener('click', () => {
                document.getElementById('charSelect').classList.add('hidden');
                document.getElementById('mapSelect').classList.remove('hidden');
            });
            
            document.getElementById('startGame').addEventListener('click', startGame);
            
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
        }

        function createCharGrid() {
            const grid = document.getElementById('charGrid');
            grid.innerHTML = '';
            CHARACTERS.forEach((char, i) => {
                const card = document.createElement('div');
                card.className = 'char-card';
                card.innerHTML = `
                    <div class="char-icon">${char.icon}</div>
                    <div class="char-name" style="color:${char.color}">${char.name}</div>
                    <div class="char-type">${char.type}</div>
                    <div class="char-stats">
                        <div class="stat"><span>SPD</span><div class="stat-bar"><div class="stat-fill" style="width:${char.stats.speed * 10}%;background:${char.color}"></div></div></div>
                        <div class="stat"><span>PWR</span><div class="stat-bar"><div class="stat-fill" style="width:${char.stats.power * 10}%;background:${char.color}"></div></div></div>
                        <div class="stat"><span>JMP</span><div class="stat-bar"><div class="stat-fill" style="width:${char.stats.jump * 10}%;background:${char.color}"></div></div></div>
                    </div>
                    <div class="special-move">🎯 ${char.special}</div>
                `;
                card.addEventListener('click', () => selectChar(char, card));
                grid.appendChild(card);
            });
        }

        function selectChar(char, card) {
            document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedChar = char;
            document.getElementById('confirmChar').disabled = false;
        }

        function createMapGrid() {
            const grid = document.getElementById('mapGrid');
            grid.innerHTML = '';
            MAPS.forEach((map, i) => {
                const card = document.createElement('div');
                card.className = 'map-card';
                card.innerHTML = `
                    <div class="map-preview" style="background: ${map.bgColor}">${map.icon}</div>
                    <div class="map-name">${map.name}</div>
                    <div class="map-desc">${map.desc}</div>
                `;
                card.addEventListener('click', () => selectMap(map, card));
                grid.appendChild(card);
            });
        }

        function selectMap(map, card) {
            document.querySelectorAll('.map-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedMap = map;
            document.getElementById('startGame').disabled = false;
        }

        function clearGameTimeouts() {
            gameTimeouts.forEach(t => clearTimeout(t));
            gameTimeouts = [];
        }

        function startGame() {
            document.getElementById('mapSelect').classList.add('hidden');
            const gameScreen = document.getElementById('gameScreen');
            gameScreen.classList.remove('hidden');
            
            canvas = document.getElementById('gameCanvas');
            canvas.width = 1200;
            canvas.height = 750;
            ctx = canvas.getContext('2d');
            
            currentMap = selectedMap;
            clearGameTimeouts();
            
            // Create players
            const aiChar = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)];
            players = [
                createPlayer(selectedChar, true, selectedChar.color),
                createPlayer(aiChar, false, aiChar.color)
            ];
            
            players[0].x = 400;
            players[0].y = 400;
            players[1].x = 800;
            players[1].y = 400;
            
            projectiles = [];
            shockwaves = [];
            particles = [];
            specialEffects = [];
            screenFlash = { color: '', frames: 0 };
            
            updateHUD();
            createStockDisplay();
            
            gameRunning = true;
            gameLoop();
        }

        function createPlayer(char, isPlayer, color) {
            const isBowser = char.id === 'bowser';
            return {
                char: char,
                isPlayer: isPlayer,
                color: color,
                x: 400,
                y: 300,
                vx: 0,
                vy: 0,
                width: isBowser ? 50 : 40,
                height: isBowser ? 60 : 50,
                onGround: false,
                facing: isPlayer ? 1 : -1,
                health: 100,
                percent: 0,
                stocks: 3,
                attacking: false,
                attackFrame: 0,
                specialCooldown: 0,
                frozen: 0,
                jumpCount: 0,
                diving: false,
                spinAttack: 0,
                invulnerable: 0,
                keys: {},
                ai: !isPlayer ? createAI(char) : null
            };
        }

        function createAI(char) {
            return {
                reactionTime: 30,
                timer: 0,
                targetY: 300,
                lastAction: 0
            };
        }

        function createStockDisplay() {
            const p1Stock = document.getElementById('p1Stock');
            const p2Stock = document.getElementById('p2Stock');
            p1Stock.innerHTML = '';
            p2Stock.innerHTML = '';
            
            for(let i = 0; i < 3; i++) {
                p1Stock.innerHTML += `<div class="stock" id="p1-stock-${i}"></div>`;
                p2Stock.innerHTML += `<div class="stock" id="p2-stock-${i}"></div>`;
            }
        }

        function updateStockDisplay() {
            for(let i = 0; i < 3; i++) {
                const s1 = document.getElementById(`p1-stock-${i}`);
                const s2 = document.getElementById(`p2-stock-${i}`);
                if (s1) s1.classList.toggle('lost', i >= players[0].stocks);
                if (s2) s2.classList.toggle('lost', i >= players[1].stocks);
            }
        }

        function updateHUD() {
            if (players.length < 2) return;
            document.getElementById('p1Name').textContent = players[0].char.name;
            document.getElementById('p2Name').textContent = players[1].char.name;
            document.getElementById('p1Health').style.width = Math.max(0, players[0].health) + '%';
            document.getElementById('p2Health').style.width = Math.max(0, players[1].health) + '%';
            document.getElementById('p1Percent').textContent = Math.floor(players[0].percent) + '%';
            document.getElementById('p2Percent').textContent = Math.floor(players[1].percent) + '%';
            updateStockDisplay();
        }

        let keys = {};
        function handleKeyDown(e) {
            keys[e.code] = true;
            if (e.code === 'KeyR' && players.length === 2) {
                resetGame();
            }
            if (e.code === 'KeyJ' && players[0].attacking === false && players[0].frozen <= 0) {
                players[0].attacking = true;
                players[0].attackFrame = 15;
            }
            if (e.code === 'KeyK' && players[0].specialCooldown <= 0 && players[0].frozen <= 0) {
                useSpecialMove(players[0], players[1]);
            }
            if ((e.code === 'KeyL' || e.code === 'Space') && players[0].frozen <= 0) {
                if (players[0].onGround) {
                    jump(players[0]);
                } else {
                    const maxJumps = players[0].char.id === 'kirby' ? 4 : 2;
                    if (players[0].jumpCount < maxJumps) {
                        players[0].vy = -11;
                        players[0].jumpCount++;
                    }
                }
            }
        }
        
        function handleKeyUp(e) {
            keys[e.code] = false;
        }

        function jump(player) {
            player.vy = -12 - player.char.stats.jump * 0.4;
            player.onGround = false;
            player.jumpCount = 1;
            
            // Spawn jump dust particles
            for (let i = 0; i < 5; i++) {
                createParticle(
                    player.x + player.width / 2, 
                    player.y + player.height, 
                    '#fff', 
                    3 + Math.random() * 2, 
                    (Math.random() - 0.5) * 3, 
                    -Math.random() * 1.5, 
                    15
                );
            }
        }

        function triggerSpecialEffect(player, text, color) {
            specialEffects.push({
                x: player.x + player.width/2,
                y: player.y - 40,
                text: text,
                color: color,
                life: 50,
                maxLife: 50
            });
        }

        function triggerFlash(color, frames) {
            screenFlash.color = color;
            screenFlash.frames = frames;
        }

        function createParticle(x, y, color, size, vx, vy, life) {
            particles.push({
                x: x,
                y: y,
                color: color,
                size: size,
                vx: vx,
                vy: vy,
                life: life,
                maxLife: life
            });
        }

        function useSpecialMove(user, target) {
            user.specialCooldown = user.char.specialCooldown;
            const charId = user.char.id;
            
            if (charId === 'mario') {
                triggerSpecialEffect(user, '🔥 FIREBALL! 🔥', '#e74c3c');
                triggerFlash('rgba(231, 76, 60, 0.25)', 3);
                projectiles.push({
                    x: user.x + (user.facing * 30),
                    y: user.y + 15,
                    vx: user.facing * 9,
                    vy: 1,
                    owner: user,
                    type: 'fireball',
                    damage: 10,
                    size: 10
                });
            } else if (charId === 'bowser') {
                triggerSpecialEffect(user, '🔥 FIRE BREATH! 🔥', '#e67e22');
                triggerFlash('rgba(230, 126, 34, 0.25)', 3);
                const fireTimer = (delay, index) => {
                    gameTimeouts.push(setTimeout(() => {
                        if (!gameRunning) return;
                        projectiles.push({
                            x: user.x + (user.facing * 40),
                            y: user.y + 15,
                            vx: user.facing * 7,
                            vy: (Math.random() - 0.5) * 1.5,
                            owner: user,
                            type: 'fire',
                            damage: 4,
                            size: 12 + index * 4
                        });
                    }, delay));
                };
                for (let i = 0; i < 4; i++) {
                    fireTimer(i * 100, i);
                }
            } else if (charId === 'link') {
                triggerSpecialEffect(user, '🌀 SPIN ATTACK! 🌀', '#2ecc71');
                triggerFlash('rgba(46, 204, 113, 0.25)', 3);
                user.spinAttack = 25;
                user.vx = user.facing * 6;
            } else if (charId === 'samus') {
                triggerSpecialEffect(user, '⚡ CHARGE SHOT! ⚡', '#3498db');
                triggerFlash('rgba(52, 152, 219, 0.25)', 3);
                projectiles.push({
                    x: user.x + (user.facing * 40),
                    y: user.y + 20,
                    vx: user.facing * 14,
                    vy: 0,
                    owner: user,
                    type: 'charge',
                    damage: 18,
                    size: 16
                });
            } else if (charId === 'kirby') {
                triggerSpecialEffect(user, '🌪️ INHALE! 🌪️', '#ffb6c1');
                triggerFlash('rgba(255, 182, 193, 0.25)', 3);
                // Create vacuum particle lines moving towards Kirby
                for (let i = 0; i < 8; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 60 + Math.random() * 60;
                    const px = user.x + user.width/2 + Math.cos(angle) * dist;
                    const py = user.y + user.height/2 + Math.sin(angle) * dist;
                    createParticle(
                        px, 
                        py, 
                        'rgba(255,255,255,0.4)', 
                        2, 
                        (user.x + user.width/2 - px) / 10, 
                        (user.y + user.height/2 - py) / 10, 
                        10
                    );
                }
                if (getDistance(user, target) < 85) {
                    const kbDir = user.facing;
                    const kbStrength = 10 + target.percent * 0.08;
                    applyDamage(target, 12, kbDir * kbStrength);
                    createShockwave(user.x + user.facing * 40, user.y + 20);
                }
            } else if (charId === 'pikachu') {
                triggerSpecialEffect(user, '⚡ THUNDER! ⚡', '#f1c40f');
                triggerFlash('rgba(241, 196, 15, 0.35)', 4);
                const strikeX = target.x + target.width/2;
                projectiles.push({
                    x: strikeX,
                    y: 0,
                    vx: 0,
                    vy: 16,
                    owner: user,
                    type: 'lightning',
                    damage: 14,
                    size: 12
                });
                createShockwave(strikeX, target.y + target.height);
            }
        }

        function applyDamage(victim, damage, knockback) {
            if (victim.invulnerable > 0) return;
            victim.health -= damage * 0.35;
            victim.percent += damage;
            
            victim.vx += knockback;
            victim.vy -= 4 + damage * 0.08;
            
            // Spawn hit sparks
            for (let i = 0; i < 8; i++) {
                createParticle(
                    victim.x + victim.width / 2, 
                    victim.y + victim.height / 2, 
                    victim.color, 
                    2 + Math.random() * 3, 
                    (Math.random() - 0.5) * 6, 
                    (Math.random() - 0.5) * 6, 
                    15
                );
            }
            
            // Shake effect
            document.getElementById('gameCanvas').classList.add('shake');
            setTimeout(() => document.getElementById('gameCanvas').classList.remove('shake'), 200);
            
            if (victim.health <= 0) {
                victim.health = 100;
                victim.stocks--;
                if (victim.stocks <= 0) {
                    endGame(players[0] === victim ? players[1] : players[0]);
                } else {
                    respawn(victim);
                }
            }
        }

        function respawn(player) {
            player.x = canvas.width / 2;
            player.y = 150;
            player.vx = 0;
            player.vy = 0;
            player.health = 100;
            player.percent = 0;
            player.invulnerable = 180;
            
            const msg = document.getElementById('gameMessage');
            msg.textContent = `${player.char.name} respawning!`;
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 1500);
        }

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
        }

        function checkPlatformCollision(player, platform) {
            const wasAbove = player.y + player.height - player.vy <= platform.y;
            const nowBelow = player.y + player.height >= platform.y;
            const horizontallyAligned = player.x + player.width > platform.x && player.x < platform.x + platform.w;
            
            if (wasAbove && nowBelow && horizontallyAligned) {
                player.y = platform.y - player.height;
                player.vy = 0;
                return true;
            }
            return false;
        }

        function createShockwave(x, y) {
            shockwaves.push({
                x: x,
                y: y,
                radius: 10,
                alpha: 1
            });
        }

        function update() {
            if (!gameRunning) return;
            
            // Update map background details (clouds, lava bubbles)
            if (currentMap) {
                if (currentMap.id === 'sky') {
                    bgClouds.forEach(c => {
                        c.x += c.speed;
                        if (c.x > canvas.width + 100) c.x = -100;
                    });
                } else if (currentMap.id === 'volcano') {
                    bgLavaBubbles.forEach(b => {
                        b.y += b.vy;
                        if (b.y < 680) {
                            b.y = 750;
                            b.x = Math.random() * canvas.width;
                            b.vy = -0.5 - Math.random() * 1;
                        }
                    });
                }
            }
            
            // Update player input
            if (players[0].frozen <= 0) {
                let moveSpeed = 4 + players[0].char.stats.speed * 0.5;
                players[0].vx = 0;
                if (keys['KeyA'] || keys['ArrowLeft']) {
                    players[0].vx = -moveSpeed;
                    players[0].facing = -1;
                }
                if (keys['KeyD'] || keys['ArrowRight']) {
                    players[0].vx = moveSpeed;
                    players[0].facing = 1;
                }
            }
            
            // AI update
            if (players[1].frozen <= 0) {
                updateAI(players[1], players[0]);
            }
            
            // Physics
            players.forEach(p => {
                if (p.frozen > 0) {
                    p.frozen--;
                    return;
                }
                
                // Gravity
                p.vy += 0.6;
                
                // Apply velocity
                p.x += p.vx;
                p.y += p.vy;
                
                // Friction
                p.vx *= 0.9;
                
                // Movement trail particles
                if (Math.abs(p.vx) > 0.5 && p.onGround) {
                    if (Math.random() < 0.25) {
                        createParticle(p.x + p.width/2, p.y + p.height, '#fff', 3, (Math.random() - 0.5) * 1, -Math.random() * 0.5, 12);
                    }
                }
                
                // Character specific visual trails
                if (p.char.id === 'pikachu') {
                    if (Math.random() < 0.15) {
                        createParticle(p.x + Math.random() * p.width, p.y + Math.random() * p.height, '#f1c40f', 2, (Math.random() - 0.5) * 1.5, (Math.random() - 0.5) * 1.5, 15);
                    }
                } else if (p.char.id === 'mario') {
                    if (Math.random() < 0.08) {
                        createParticle(p.x + Math.random() * p.width, p.y + Math.random() * p.height, '#e74c3c', 2, 0, -0.4, 12);
                    }
                }
                
                // Spin attack (Link)
                if (p.spinAttack > 0) {
                    p.spinAttack--;
                    // Slashing sparks around Link
                    createParticle(
                        p.x + p.width/2 + (Math.random() - 0.5) * 80, 
                        p.y + p.height/2 + (Math.random() - 0.5) * 80, 
                        '#2ecc71', 
                        2, 
                        0, 
                        0, 
                        10
                    );
                    const other = players[0] === p ? players[1] : players[0];
                    if (Math.abs(p.x - other.x) < 65 && Math.abs(p.y - other.y) < 60 && p.spinAttack > 5) {
                        const kbStrength = 3 + other.percent * 0.04;
                        applyDamage(other, 3, p.facing * kbStrength);
                    }
                }
                
                // Reset jump on ground & platform collisions
                p.onGround = false;
                if (currentMap && currentMap.platforms) {
                    currentMap.platforms.forEach(plat => {
                        const preColVy = p.vy;
                        if (checkPlatformCollision(p, plat)) {
                            p.onGround = true;
                            p.jumpCount = 0;
                            
                            // If the player was diving
                            if (p.diving) {
                                p.diving = false;
                                const other = players[0] === p ? players[1] : players[0];
                                if (getDistance(p, other) < 120) {
                                    const spikeDamage = Math.min(25, preColVy * 1.5);
                                    applyDamage(other, spikeDamage, (other.x > p.x ? 1 : -1) * (6 + other.percent * 0.05));
                                }
                                createShockwave(p.x + p.width/2, p.y + p.height);
                            }
                        }
                    });
                }
                
                // Blast zones (death boundaries)
                if (p.x < -120 || p.x > canvas.width + 120 || p.y > canvas.height + 120) {
                    p.health = 100;
                    p.percent = 0;
                    p.stocks--;
                    if (p.stocks <= 0) {
                        endGame(players[0] === p ? players[1] : players[0]);
                    } else {
                        respawn(p);
                    }
                }
                
                // Attack logic
                if (p.attacking) {
                    p.attackFrame--;
                    if (p.attackFrame === 8) {
                        // Hit frame
                        const other = players[0] === p ? players[1] : players[0];
                        if (Math.abs(p.x - other.x) < 60 && Math.abs(p.y - other.y) < 50) {
                            const damage = 8 + p.char.stats.power;
                            const knockback = 8 + other.percent * 0.1;
                            applyDamage(other, damage, p.facing * knockback);
                        }
                    }
                    if (p.attackFrame <= 0) {
                        p.attacking = false;
                    }
                }
                
                // Cooldowns
                if (p.specialCooldown > 0) p.specialCooldown--;
                if (p.invulnerable > 0) p.invulnerable--;
            });
            
            // Update projectiles
            projectiles = projectiles.filter(proj => {
                if (proj.vy === undefined) proj.vy = 0;
                
                // Add bounce and gravity behavior for Mario's fireball
                if (proj.type === 'fireball') {
                    proj.vy += 0.4;
                    if (currentMap && currentMap.platforms) {
                        currentMap.platforms.forEach(plat => {
                            if (proj.x > plat.x && proj.x < plat.x + plat.w &&
                                proj.y + proj.size >= plat.y && proj.y - proj.size <= plat.y + plat.h) {
                                // bounce
                                proj.y = plat.y - proj.size;
                                proj.vy = -6;
                            }
                        });
                    }
                }
                
                // Spawn trailing particles
                if (proj.type === 'fireball' || proj.type === 'fire') {
                    if (Math.random() < 0.35) {
                        createParticle(proj.x, proj.y, '#e67e22', proj.size * 0.5, (Math.random() - 0.5) * 1.5, (Math.random() - 0.5) * 1.5, 10);
                    }
                } else if (proj.type === 'charge') {
                    if (Math.random() < 0.45) {
                        createParticle(proj.x, proj.y, '#3498db', proj.size * 0.4, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, 12);
                    }
                } else if (proj.type === 'lightning') {
                    if (Math.random() < 0.6) {
                        createParticle(proj.x, proj.y + Math.random() * 40, '#f1c40f', 3, (Math.random() - 0.5) * 2, 0, 10);
                    }
                }
                
                proj.x += proj.vx;
                proj.y += proj.vy;
                
                // Check collision with players
                let hit = false;
                players.forEach(p => {
                    if (p === proj.owner || p.invulnerable > 0) return;
                    if (Math.abs(proj.x - p.x) < 30 && Math.abs(proj.y - p.y) < 30) {
                        const kbDirection = proj.vx >= 0 ? 1 : -1;
                        if (proj.type === 'lightning') {
                            applyDamage(p, proj.damage, (p.x > proj.x ? 1 : -1) * (6 + p.percent * 0.08));
                        } else {
                            applyDamage(p, proj.damage, kbDirection * (5 + p.percent * 0.08));
                        }
                        hit = true;
                    }
                });
                if (hit) return false;
                
                return proj.x > -100 && proj.x < canvas.width + 100 && proj.y > -100 && proj.y < canvas.height + 150;
            });
            
            // Update particles
            particles = particles.filter(part => {
                part.x += part.vx;
                part.y += part.vy;
                part.life--;
                return part.life > 0;
            });
            
            // Update shockwaves
            shockwaves = shockwaves.filter(s => {
                s.radius += 4;
                s.alpha -= 0.04;
                return s.alpha > 0;
            });
            
            // Update special text effects
            specialEffects = specialEffects.filter(eff => {
                eff.y -= 1.2;
                eff.life--;
                return eff.life > 0;
            });
            
            // Update screen flash
            if (screenFlash.frames > 0) {
                screenFlash.frames--;
            }
            
            updateHUD();
        }

        function updateAI(ai, player) {
            const char = ai.char;
            const speed = 3 + char.stats.speed * 0.4;
            
            const targetX = player.x;
            const targetY = player.y;
            
            // Move towards player
            if (ai.x < targetX - 40) {
                ai.vx = speed;
                ai.facing = 1;
            } else if (ai.x > targetX + 40) {
                ai.vx = -speed;
                ai.facing = -1;
            }
            
            // Jump if player is above
            const maxJumps = ai.char.id === 'kirby' ? 4 : 2;
            if (targetY < ai.y - 60 && Math.random() < 0.06) {
                if (ai.onGround) {
                    jump(ai);
                } else if (ai.jumpCount < maxJumps) {
                    ai.vy = -11;
                    ai.jumpCount++;
                }
            }
            
            // Attack if close
            if (Math.abs(ai.x - player.x) < 60 && Math.abs(ai.y - player.y) < 50 && !ai.attacking && Math.random() < 0.08) {
                ai.attacking = true;
                ai.attackFrame = 15;
            }
            
            // Use special
            if (ai.specialCooldown <= 0 && Math.random() < 0.02) {
                useSpecialMove(ai, player);
            }
            
            // Recovery AI - go to center if too far left or right
            if (ai.x < 150 || ai.x > canvas.width - 150) {
                if (ai.onGround && Math.random() < 0.1) {
                    jump(ai);
                }
                if (!ai.onGround && ai.vy > 1 && ai.jumpCount < maxJumps && Math.random() < 0.1) {
                    ai.vy = -11;
                    ai.jumpCount++;
                }
                if (ai.x < 150) ai.vx = speed;
                else ai.vx = -speed;
            }
        }

        function draw() {
            // Background
            if (currentMap) {
                if (currentMap.id === 'training') {
                    let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                    grad.addColorStop(0, '#111122');
                    grad.addColorStop(1, '#2d3436');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // Cyberspace Stadium Grid lines
                    ctx.strokeStyle = 'rgba(72, 219, 251, 0.08)';
                    ctx.lineWidth = 1;
                    for (let x = 0; x < canvas.width; x += 50) {
                        ctx.beginPath();
                        ctx.moveTo(x, 0);
                        ctx.lineTo(x, canvas.height);
                        ctx.stroke();
                    }
                    for (let y = 0; y < canvas.height; y += 50) {
                        ctx.beginPath();
                        ctx.moveTo(0, y);
                        ctx.lineTo(canvas.width, y);
                        ctx.stroke();
                    }
                } else if (currentMap.id === 'sky') {
                    let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                    grad.addColorStop(0, '#0f3057');
                    grad.addColorStop(1, '#00587a');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // Floating clouds
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
                    bgClouds.forEach(c => {
                        ctx.beginPath();
                        ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
                        ctx.arc(c.x + c.size * 0.5, c.y - c.size * 0.2, c.size * 0.8, 0, Math.PI * 2);
                        ctx.arc(c.x - c.size * 0.5, c.y - c.size * 0.2, c.size * 0.8, 0, Math.PI * 2);
                        ctx.fill();
                    });
                } else if (currentMap.id === 'volcano') {
                    let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                    grad.addColorStop(0, '#150505');
                    grad.addColorStop(0.7, '#2c0a0a');
                    grad.addColorStop(1, '#ff3300');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // Lava bottom
                    ctx.fillStyle = '#ff3300';
                    ctx.fillRect(0, 700, canvas.width, 50);
                    
                    // Lava rising bubbles
                    ctx.fillStyle = '#ff9900';
                    bgLavaBubbles.forEach(b => {
                        ctx.save();
                        ctx.globalAlpha = b.alpha;
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    });
                }
            } else {
                ctx.fillStyle = '#2d3436';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            // Draw particles
            particles.forEach(part => {
                ctx.save();
                ctx.globalAlpha = part.life / part.maxLife;
                ctx.fillStyle = part.color;
                ctx.beginPath();
                ctx.arc(part.x, part.y, part.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
            
            // Draw shockwaves
            shockwaves.forEach(s => {
                ctx.save();
                ctx.strokeStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            });
            
            // Platforms
            if (currentMap && currentMap.platforms) {
                ctx.fillStyle = '#8e44ad';
                currentMap.platforms.forEach(plat => {
                    ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                });
            }
            
            // Projectiles
            projectiles.forEach(proj => {
                if (proj.type === 'fireball' || proj.type === 'fire') {
                    ctx.fillStyle = '#e74c3c';
                    ctx.beginPath();
                    ctx.arc(proj.x, proj.y, proj.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#f39c12';
                    ctx.beginPath();
                    ctx.arc(proj.x, proj.y, proj.size * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                } else if (proj.type === 'lightning') {
                    ctx.fillStyle = '#f1c40f';
                    ctx.fillRect(proj.x - 4, proj.y, 8, 40);
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(proj.x - 2, proj.y, 4, 40);
                } else if (proj.type === 'charge') {
                    ctx.fillStyle = '#3498db';
                    ctx.beginPath();
                    ctx.ellipse(proj.x, proj.y, proj.size * 1.4, proj.size * 0.8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.ellipse(proj.x, proj.y, proj.size * 0.8, proj.size * 0.4, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            
            // Players
            players.forEach(p => {
                ctx.save();
                
                // Invulnerability flash
                if (p.invulnerable && Math.floor(p.invulnerable / 5) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }
                
                // Frozen effect
                if (p.frozen > 0) {
                    ctx.fillStyle = 'rgba(72,219,251,0.5)';
                    ctx.fillRect(p.x - 5, p.y - 5, p.width + 10, p.height + 10);
                }
                
                // Spin attack effect (Link)
                if (p.spinAttack > 0) {
                    ctx.strokeStyle = '#27ae60';
                    ctx.lineWidth = 4;
                    ctx.globalAlpha = 0.7;
                    ctx.beginPath();
                    ctx.arc(p.x + p.width/2, p.y + p.height/2, 35 + (25 - p.spinAttack), 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }
                
                // Character specific visual drawings
                if (p.char.id === 'kirby') {
                    // Kirby cute round body
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x + p.width/2, p.y + p.height/2, p.width/2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    // Red feet
                    ctx.fillStyle = '#ff2a70';
                    ctx.beginPath();
                    ctx.ellipse(p.x + p.width * 0.25, p.y + p.height - 2, p.width * 0.2, 5, 0, 0, Math.PI * 2);
                    ctx.ellipse(p.x + p.width * 0.75, p.y + p.height - 2, p.width * 0.2, 5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                } else {
                    // Box body
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(p.x, p.y, p.width, p.height);
                }
                
                // Samus arm cannon
                if (p.char.id === 'samus') {
                    ctx.fillStyle = '#f1c40f';
                    const armX = p.facing > 0 ? p.x + p.width - 5 : p.x - 10;
                    ctx.fillRect(armX, p.y + p.height * 0.4, 15, 10);
                    ctx.strokeStyle = '#fff';
                    ctx.strokeRect(armX, p.y + p.height * 0.4, 15, 10);
                }
                
                // Link's sword
                if (p.char.id === 'link') {
                    ctx.strokeStyle = '#bdc3c7';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    if (p.facing > 0) {
                        ctx.moveTo(p.x + p.width - 5, p.y + p.height * 0.5);
                        ctx.lineTo(p.x + p.width + 12, p.y + p.height * 0.15);
                    } else {
                        ctx.moveTo(p.x + 5, p.y + p.height * 0.5);
                        ctx.lineTo(p.x - 12, p.y + p.height * 0.15);
                    }
                    ctx.stroke();
                }
                
                // Face (Eye) - adjusted for Bowser scale
                ctx.fillStyle = '#000';
                const eyeX = p.facing > 0 ? p.x + p.width * 0.65 : p.x + p.width * 0.2;
                ctx.fillRect(eyeX, p.y + p.height * 0.25, p.width * 0.15, p.height * 0.12);
                
                // Character icon above head
                ctx.font = '24px Arial';
                ctx.fillStyle = p.color;
                ctx.textAlign = 'center';
                ctx.fillText(p.char.icon, p.x + p.width/2, p.y - 15);
                
                // Attack visual
                if (p.attacking && p.attackFrame > 8) {
                    ctx.fillStyle = '#fff';
                    const attackX = p.facing > 0 ? p.x + p.width : p.x - 30;
                    ctx.fillRect(attackX, p.y + 15, 30, 20);
                }
                
                ctx.restore();
            });
            
            // Draw special rising text effects
            specialEffects.forEach(eff => {
                ctx.save();
                ctx.font = 'bold 16px Arial';
                ctx.fillStyle = eff.color;
                ctx.textAlign = 'center';
                ctx.shadowColor = '#000';
                ctx.shadowBlur = 4;
                ctx.fillText(eff.text, eff.x, eff.y);
                ctx.restore();
            });
            
            // Draw screen flash
            if (screenFlash.frames > 0) {
                ctx.save();
                ctx.fillStyle = screenFlash.color;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            }
        }

        function gameLoop() {
            if (gameRunning) {
                update();
                draw();
            }
            requestAnimationFrame(gameLoop);
        }

        function endGame(winner) {
            gameRunning = false;
            const msg = document.getElementById('gameMessage');
            msg.innerHTML = `${winner.char.name} Wins!<br><span style="font-size:16px">Press R to restart</span>`;
            msg.classList.add('show');
        }

        function resetGame() {
            clearGameTimeouts();
            players[0].x = 400;
            players[0].y = 400;
            players[0].health = 100;
            players[0].percent = 0;
            players[0].stocks = 3;
            players[0].vx = 0;
            players[0].vy = 0;
            players[0].jumpCount = 0;
            players[0].diving = false;
            players[0].spinAttack = 0;
            players[0].invulnerable = 0;
            
            players[1].x = 800;
            players[1].y = 400;
            players[1].health = 100;
            players[1].percent = 0;
            players[1].stocks = 3;
            players[1].vx = 0;
            players[1].vy = 0;
            players[1].jumpCount = 0;
            players[1].diving = false;
            players[1].spinAttack = 0;
            players[1].invulnerable = 0;
            
            projectiles = [];
            shockwaves = [];
            particles = [];
            specialEffects = [];
            screenFlash = { color: '', frames: 0 };
            
            document.getElementById('gameMessage').classList.remove('show');
            createStockDisplay();
            updateHUD();
            gameRunning = true;
        }

        init();
    </script>
</body>
</html>
