<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong - You vs AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
        }
        canvas {
            background: #000;
            border: 3px solid #fff;
            display: block;
        }
        #score {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 80px;
            color: #fff;
            font-size: 48px;
            font-weight: bold;
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            bottom: -40px;
            width: 100%;
            text-align: center;
            color: #666;
            font-size: 14px;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 32px;
            text-align: center;
            display: none;
            text-shadow: 2px 2px 4px #000;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="score">
            <span id="playerScore">0</span>
            <span id="aiScore">0</span>
        </div>
        <canvas id="pong" width="800" height="500"></canvas>
        <div id="message"></div>
        <div id="instructions">Use Mouse to Move • First to 5 Wins</div>
    </div>

    <script>
        const canvas = document.getElementById('pong');
        const ctx = canvas.getContext('2d');
        const playerScoreEl = document.getElementById('playerScore');
        const aiScoreEl = document.getElementById('aiScore');
        const messageEl = document.getElementById('message');

        const PADDLE_WIDTH = 15;
        const PADDLE_HEIGHT = 90;
        const BALL_SIZE = 12;
        const WINNING_SCORE = 5;

        let player = { x: 20, y: canvas.height / 2 - PADDLE_HEIGHT / 2, score: 0 };
        let ai = { x: canvas.width - 35, y: canvas.height / 2 - PADDLE_HEIGHT / 2, score: 0, speed: 2.2 };
        let ball = { x: canvas.width / 2, y: canvas.height / 2, vx: 0, vy: 0, speed: 5 };
        let gameOver = false;

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = 5;
            const angle = (Math.random() * Math.PI / 3) - Math.PI / 6;
            const direction = Math.random() > 0.5 ? 1 : -1;
            ball.vx = Math.cos(angle) * ball.speed * direction;
            ball.vy = Math.sin(angle) * ball.speed;
        }

        function resetGame() {
            player.score = 0;
            ai.score = 0;
            playerScoreEl.textContent = 0;
            aiScoreEl.textContent = 0;
            gameOver = false;
            resetBall();
            messageEl.style.display = 'none';
        }

        canvas.addEventListener('mousemove', (e) => {
            if (gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const mouseY = e.clientY - rect.top;
            player.y = mouseY - PADDLE_HEIGHT / 2;
            player.y = Math.max(0, Math.min(canvas.height - PADDLE_HEIGHT, player.y));
        });

        function update() {
            if (gameOver) return;

            ball.x += ball.vx;
            ball.y += ball.vy;

            if (ball.y <= 0 || ball.y + BALL_SIZE >= canvas.height) {
                ball.vy *= -1;
            }

            if (ball.x <= player.x + PADDLE_WIDTH && 
                ball.y + BALL_SIZE >= player.y && 
                ball.y <= player.y + PADDLE_HEIGHT &&
                ball.vx < 0) {
                ball.vx *= -1;
                ball.speed += 0.5;
                const hitPos = (ball.y - player.y - PADDLE_HEIGHT / 2) / (PADDLE_HEIGHT / 2);
                ball.vy += hitPos * 3;
                const maxSpeed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
                if (maxSpeed > ball.speed) {
                    const ratio = ball.speed / maxSpeed;
                    ball.vx *= ratio;
                    ball.vy *= ratio;
                }
                ball.x = player.x + PADDLE_WIDTH;
            }

            if (ball.x + BALL_SIZE >= ai.x && 
                ball.y + BALL_SIZE >= ai.y && 
                ball.y <= ai.y + PADDLE_HEIGHT &&
                ball.vx > 0) {
                ball.vx *= -1;
                ball.speed += 0.5;
                const hitPos = (ball.y - ai.y - PADDLE_HEIGHT / 2) / (PADDLE_HEIGHT / 2);
                ball.vy += hitPos * 3;
                const maxSpeed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
                if (maxSpeed > ball.speed) {
                    const ratio = ball.speed / maxSpeed;
                    ball.vx *= ratio;
                    ball.vy *= ratio;
                }
                ball.x = ai.x - BALL_SIZE;
            }

            const aiTarget = ball.y - PADDLE_HEIGHT / 2 + (Math.random() - 0.5) * 40;
            const aiDiff = aiTarget - ai.y;
            if (Math.abs(aiDiff) > ai.speed) {
                ai.y += aiDiff > 0 ? ai.speed : -ai.speed;
            } else {
                ai.y = aiTarget;
            }
            ai.y = Math.max(0, Math.min(canvas.height - PADDLE_HEIGHT, ai.y));

            if (ball.x < 0) {
                ai.score++;
                aiScoreEl.textContent = ai.score;
                if (ai.score >= WINNING_SCORE) {
                    gameOver = true;
                    messageEl.innerHTML = 'AI Wins!<br><span style="font-size: 18px">Click to Restart</span>';
                    messageEl.style.display = 'block';
                } else {
                    resetBall();
                }
            }
            if (ball.x > canvas.width) {
                player.score++;
                playerScoreEl.textContent = player.score;
                if (player.score >= WINNING_SCORE) {
                    gameOver = true;
                    messageEl.innerHTML = 'You Win!<br><span style="font-size: 18px">Click to Restart</span>';
                    messageEl.style.display = 'block';
                } else {
                    resetBall();
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.setLineDash([10, 10]);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#fff';
            ctx.fillRect(player.x, player.y, PADDLE_WIDTH, PADDLE_HEIGHT);
            ctx.fillRect(ai.x, ai.y, PADDLE_WIDTH, PADDLE_HEIGHT);

            ctx.beginPath();
            ctx.arc(ball.x + BALL_SIZE / 2, ball.y + BALL_SIZE / 2, BALL_SIZE / 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        canvas.addEventListener('click', () => {
            if (gameOver) {
                resetGame();
            }
        });

        resetBall();
        gameLoop();
    </script>
</body>
</html>
